<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0e14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LifeOS" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>LifeOS — Proyectos</title>
    <link rel="stylesheet" href="../styles/pico.css" />
    <link rel="stylesheet" href="../styles/theme.css" />
    <link rel="stylesheet" href="../styles/components.css" />
    <link rel="stylesheet" href="../styles/dashboard.css" />
    <link rel="stylesheet" href="../styles/animations.css" />
    <link rel="stylesheet" href="../styles/responsive.css" />
  </head>
  <body data-page="projects">
    <div data-page-content>
      <header class="page-head">
        <div>
          <h1 class="greeting">Proyectos</h1>
          <p class="greeting-sub">Lo que estás construyendo, con sus dependencias.</p>
        </div>
        <button class="btn btn--primary" id="btn-new-project" type="button">+ Nuevo proyecto</button>
      </header>

      <section class="project-grid" id="project-grid" aria-label="Lista de proyectos"></section>

      <section class="panel" id="detail-panel" hidden aria-label="Detalle del proyecto">
        <h2 class="panel__title">
          <span id="detail-title">Detalle</span>
          <button class="btn btn--ghost btn--sm" id="btn-close-detail" type="button">Cerrar ✕</button>
        </h2>
        <div id="detail-body"></div>
      </section>
    </div>

    <script type="module" src="./projects.ts"></script>
  </body>
</html>
