<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0e14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LifeOS" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>LifeOS — Simulador</title>
    <link rel="stylesheet" href="../styles/pico.css" />
    <link rel="stylesheet" href="../styles/theme.css" />
    <link rel="stylesheet" href="../styles/components.css" />
    <link rel="stylesheet" href="../styles/dashboard.css" />
    <link rel="stylesheet" href="../styles/animations.css" />
    <link rel="stylesheet" href="../styles/responsive.css" />
  </head>
  <body data-page="simulator">
    <div data-page-content>
      <header class="page-head">
        <div>
          <h1 class="greeting">Simulador</h1>
          <p class="greeting-sub">¿Qué pasa si…? Explora escenarios antes de decidir.</p>
        </div>
      </header>

      <div class="sim-layout">
        <section class="panel" aria-labelledby="sim-form-title">
          <h2 class="panel__title" id="sim-form-title">Variables del escenario</h2>
          <form id="sim-form"></form>
          <button class="btn btn--primary" id="btn-run" type="button">▶ Ejecutar simulación</button>
        </section>

        <section class="panel" aria-labelledby="sim-result-title">
          <h2 class="panel__title" id="sim-result-title">
            <span>Resultado</span>
            <span class="mono" id="sim-risk"></span>
          </h2>
          <div id="sim-summary" class="sim-summary"></div>
          <div id="sim-chart-container"></div>
          <div id="sim-affected"></div>
        </section>
      </div>

      <section class="panel" aria-labelledby="sim-history-title">
        <h2 class="panel__title" id="sim-history-title">Escenarios guardados</h2>
        <div id="sim-history"></div>
      </section>
    </div>

    <script type="module" src="./simulator.ts"></script>
  </body>
</html>
