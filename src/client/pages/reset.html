<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0e14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LifeOS" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>LifeOS — Recuperar contraseña</title>
    <link rel="stylesheet" href="../styles/pico.css" />
    <link rel="stylesheet" href="../styles/theme.css" />
    <link rel="stylesheet" href="../styles/components.css" />
    <link rel="stylesheet" href="../styles/auth.css" />
  </head>
  <body>
    <main class="auth">
      <div class="auth__card">
        <div class="auth__logo mono">◉ LIFEOS</div>
        <p class="auth__sub">Recupera el acceso a tu cuenta</p>

        <form id="form-reset" class="auth__form" novalidate>
          <label>
            Nombre
            <input name="name" type="text" autocomplete="name" required placeholder="Tu nombre" />
          </label>
          <label>
            Email
            <input name="email" type="email" autocomplete="email" required placeholder="tu@email.com" />
          </label>
          <label>
            Nueva contraseña
            <input name="password" type="password" autocomplete="new-password" required placeholder="Mínimo 8 caracteres" />
          </label>
          <label>
            Confirmar contraseña
            <input name="confirm" type="password" autocomplete="new-password" required placeholder="Repite la contraseña" />
          </label>
          <p class="auth__hint">Mínimo 8 caracteres, una mayúscula, una minúscula y un número.</p>
          <p class="auth__error" id="reset-error" role="alert" hidden></p>
          <p class="auth__success" id="reset-success" role="status" hidden></p>
          <button class="btn btn--primary auth__submit" type="submit">Restablecer contraseña</button>
        </form>

        <a class="auth__back" href="/pages/login.html">← Volver a entrar</a>
      </div>
    </main>
    <script type="module" src="./reset.ts"></script>
  </body>
</html>
