<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0e14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LifeOS" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>LifeOS — Panel</title>
    <link rel="stylesheet" href="../styles/pico.css" />
    <link rel="stylesheet" href="../styles/theme.css" />
    <link rel="stylesheet" href="../styles/components.css" />
    <link rel="stylesheet" href="../styles/dashboard.css" />
    <link rel="stylesheet" href="../styles/animations.css" />
    <link rel="stylesheet" href="../styles/responsive.css" />
  </head>
  <body data-page="overview">
    <div data-page-content>
      <section aria-labelledby="greeting">
        <h1 id="greeting" class="greeting"></h1>
        <p class="greeting-sub" id="greeting-sub"></p>
      </section>

      <section class="metrics" id="metrics" aria-label="Métricas principales"></section>

      <div class="dashboard-grid">
        <section class="panel" aria-labelledby="trajectory-title">
          <h2 class="panel__title" id="trajectory-title">
            <span>Trayectoria de vida</span>
            <span class="mono" id="trajectory-caption"></span>
          </h2>
          <svg
            class="trajectory"
            id="trajectory-chart"
            role="img"
            aria-label="Gráfico de trayectoria de objetivos"
            preserveAspectRatio="none"
          ></svg>
        </section>

        <section class="panel" aria-labelledby="vector-title">
          <h2 class="panel__title" id="vector-title">
            <span>Vector de vida</span>
            <span class="mono">dirección global</span>
          </h2>
          <div class="life-vector-wrap" id="life-vector"></div>
        </section>
      </div>

      <section aria-labelledby="today-title">
        <h2 class="panel__title" id="today-title">Hoy</h2>
        <div class="today-grid" id="today-grid"></div>
      </section>
    </div>

    <script type="module" src="./dashboard.ts"></script>
  </body>
</html>
